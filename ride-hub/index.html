<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>НОМЕР</title>
  <link rel="stylesheet" href="plates.css?v=3">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="plate-engine.js?v=1" defer></script>
  <script src="plates.js?v=3" defer></script>
</head>
<body>
  <div class="app" id="app">
    <div class="ambient-glow" id="ambientGlow"></div>
    <div class="noise"></div>

    <header class="topbar">
      <button class="icon-button menu-button" id="menuBtn" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
      <div class="balance">
        <strong id="balanceValue">0 ₽</strong>
        <span>0 S</span>
      </div>
    </header>

    <main class="machine">
      <section class="previous-slot" id="previousSlot">
        <div class="mini-plate-host" id="previousPlate"></div>
        <div class="previous-meta">
          <span id="previousTier">Обычный</span>
          <b id="previousPrice">0 ₽</b>
        </div>
      </section>

      <section class="rarity-card" id="rarityCard">
        <div class="rarity-line">
          <span id="rarityName">Обычный</span>
          <strong id="priceValue">0 ₽</strong>
        </div>
        <div class="rarity-scale" id="rarityScale" aria-label="Шкала редкости">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
      </section>

      <section class="current-slot">
        <div class="plate-host" id="currentPlate"></div>
        <div class="features" id="featureList"></div>
      </section>
    </main>

    <aside class="tool-rail">
      <button id="saveBtn" aria-label="Добавить в коллекцию">＋</button>
      <button id="settingsBtn" aria-label="Настройки">⚙</button>
      <button id="collectionBtn" aria-label="Коллекция">◇</button>
    </aside>

    <button class="roll-orb" id="rollBtn" aria-label="Выбить номер">
      <span class="play-icon"></span>
      <span class="orb-dot"></span>
    </button>

    <button class="region-chip" id="regionBtn">
      <span class="flag-small"></span>
      <span id="regionLabel">Россия · все регионы</span>
      <span class="chev">⌄</span>
    </button>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div>
          <p>НОМЕР</p>
          <span>COLLECT / RUS</span>
        </div>
        <button class="drawer-close" id="drawerClose">×</button>
      </div>
      <div class="drawer-hero">
        <span>Твой гараж</span>
        <strong id="drawerOwned">0</strong>
        <small>номеров в коллекции</small>
      </div>
      <nav class="drawer-nav">
        <button data-action="hunt" class="active"><span>◉</span><b>Выбивать</b><small>Новые сочетания</small></button>
        <button data-action="collection"><span>▦</span><b>Коллекция</b><small>Сохранённые номера</small></button>
        <button data-action="rarity"><span>◇</span><b>Редкости</b><small>Шкала и правила</small></button>
        <button data-action="region"><span>◎</span><b>Регион</b><small id="drawerRegion">Все регионы</small></button>
        <button data-action="settings"><span>⚙</span><b>Настройки</b><small>Анимации и вибрация</small></button>
      </nav>
      <div class="drawer-foot">
        <span id="rollCounter">0 выбито</span>
        <span>v3.0</span>
      </div>
    </aside>

    <section class="panel" id="panel" aria-hidden="true">
      <div class="panel-head">
        <div>
          <p id="panelEyebrow">НОМЕР</p>
          <h2 id="panelTitle">Коллекция</h2>
        </div>
        <button id="panelClose">×</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </section>

    <div class="toast" id="toast" role="status"></div>
  </div>
</body>
</html>
