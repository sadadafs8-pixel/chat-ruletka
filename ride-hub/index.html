<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050807"><title>MINT VPN</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 15%,#10362c 0,#07110e 28%,#030504 65%);color:#effff9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:430px;margin:auto;min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) 20px 30px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:3px;font-size:21px}.mint{color:#63ffd0}.pill{font-size:12px;padding:8px 11px;border:1px solid #245448;border-radius:999px;color:#9fffe1;background:#071410}.hero{text-align:center;padding-top:45px}.status{font-size:12px;letter-spacing:2px;color:#8b9e98}.power{width:190px;height:190px;margin:22px auto;border-radius:50%;display:grid;place-items:center;background:#07100d;border:1px solid #246b58;box-shadow:0 0 30px #37ffc944,inset 0 0 30px #37ffc918;cursor:pointer;transition:.25s}.power.on{background:#0b241d;box-shadow:0 0 60px #37ffc977,inset 0 0 35px #37ffc933;transform:scale(1.03)}.icon{font-size:54px;color:#64ffd1}.title{font-size:28px;font-weight:800;margin:8px}.sub{color:#7f938d;font-size:14px}.card{margin-top:35px;background:#080d0b;border:1px solid #17231f;border-radius:22px;padding:16px}.server{display:flex;align-items:center;gap:13px}.flag{font-size:31px}.server b{display:block}.server span{font-size:12px;color:#7e928b}.ping{margin-left:auto;color:#66ffd2;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#050806;border-radius:15px;padding:13px 8px;text-align:center}.stat small{display:block;color:#63736e;font-size:10px;margin-bottom:5px}.stat b{font-size:13px}.locations{margin-top:18px}.locations h3{font-size:15px}.row{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.country{min-width:105px;padding:12px;border-radius:16px;background:#080d0b;border:1px solid #17231f;text-align:center;font-size:12px}.country strong{display:block;font-size:23px;margin-bottom:4px}.note{text-align:center;color:#50605b;font-size:10px;margin-top:28px}</style></head><body><main class="app"><header class="top"><div class="brand"><span class="mint">MINT</span> VPN</div><div class="pill">PROTECTED</div></header><section class="hero"><div class="status" id="status">READY TO CONNECT</div><div class="power" id="power"><div class="icon">⏻</div></div><div class="title" id="title">Connect</div><div class="sub" id="sub">Fast. Private. Simple.</div></section><section class="card"><div class="server"><div class="flag">🇩🇪</div><div><b>Germany</b><span>Frankfurt · Smart server</span></div><div class="ping">24 ms</div></div><div class="stats"><div class="stat"><small>IP</small><b id="ip">Hidden</b></div><div class="stat"><small>DOWNLOAD</small><b>— Mbps</b></div><div class="stat"><small>SESSION</small><b id="timer">00:00</b></div></div></section><section class="locations"><h3>Popular locations</h3><div class="row"><div class="country"><strong>🇳🇱</strong>Netherlands</div><div class="country"><strong>🇫🇮</strong>Finland</div><div class="country"><strong>🇨🇭</strong>Switzerland</div><div class="country"><strong>🇺🇸</strong>USA</div><div class="country"><strong>🇯🇵</strong>Japan</div></div></section><div class="note">UI DEMO · VPN tunnel is not active yet</div></main><script>const p=document.querySelector('#power'),s=document.querySelector('#status'),t=document.querySelector('#title'),sub=document.querySelector('#sub'),timer=document.querySelector('#timer');let on=false,start=0,int;p.onclick=()=>{on=!on;p.classList.toggle('on',on);s.textContent=on?'DEMO CONNECTED':'READY TO CONNECT';t.textContent=on?'Protected':'Connect';sub.textContent=on?'Germany · Frankfurt':'Fast. Private. Simple.';clearInterval(int);timer.textContent='00:00';if(on){start=Date.now();int=setInterval
