<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ride Hub QR Test</title><style>body{margin:0;background:#090a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:600px;margin:auto;padding:20px 16px 40px}h1{font-size:30px;margin:12px 0}.muted{color:#9aa1ac;line-height:1.45}.box{position:relative;overflow:hidden;border-radius:22px;background:#11151a;aspect-ratio:3/4;border:1px solid #303741}video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;left:14%;right:14%;top:27%;aspect-ratio:1;border:3px solid #b9ff38;border-radius:20px;box-shadow:0 0 0 999px #0004}.hint{position:absolute;left:14px;right:14px;bottom:14px;background:#0b0d11df;border:1px solid #333a45;border-radius:14px;padding:10px;text-align:center}.btn{width:100%;min-height:54px;border:0;border-radius:16px;background:#b9ff38;color:#10130d;font-weight:900;font-size:16px;margin-top:12px}.card{margin-top:12px;padding:14px;border-radius:18px;border:1px solid #303741;background:#15181d}.out{margin-top:9px;padding:12px;border-radius:14px;background:#0b0d10;border:1px solid #292f38;min-height:64px;white-space:pre-wrap;word-break:break-all;font:12px/1.45 ui-monospace,Menlo,monospace}.code{display:flex;gap:8px;margin-top:10px}.code input{min-width:0;flex:1;min-height:50px;border-radius:14px;border:1px solid #333944;background:#0d0f13;color:#fff;padding:0 13px;font-size:16px}.code button{border:1px solid #353b46;background:#222731;color:#fff;border-radius:14px;padding:0 16px;font-weight:900}</style></head><body><main class="app"><div class="muted">Ride Hub · QR TEST</div><h1>Наведи камеру на QR</h1><p class="muted">Разреши камеру и держи наклейку внутри рамки. Ниже появится точное содержимое QR.</p><div class="box"><video id="v" playsinline muted></video><div class="frame"></div><div id="hint" class="hint">Камера выключена</div></div><button id="start" class="btn">Включить камеру</button><section class="card"><b>Результат</b><div id="out" class="out">QR ещё не считан.</div><div class="code"><input id="manual" value="HC057A"><button id="use" type="button">Код</button></div></section></main><canvas id="c" hidden></canvas><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>(()=>{const v=document.querySelector('#v'),c=document.querySelector('#c'),x=c.getContext('2d',{willReadFrequently:true}),out=document.querySelector('#out'),hint=document.querySelector('#hint');let run=false,s=null;function show(t){out.textContent=t;hint.textContent='Считано ✓';run=false;if(s)s.getTracks().forEach(t=>t.stop())}async function start(){try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=s;await v.play();run=true;hint.textContent='Держи QR внутри рамки';requestAnimationFrame(scan)}catch(e){hint.textContent='Камера недоступна: '+(e.message||e)}}function scan(){if(!run)return;if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const im=x.getImageData(0,0,c.width,c.height);const q=window.jsQR&&jsQR(im.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(q&&q.data){show(q.data);return}}requestAnimationFrame(scan)}document.querySelector('#start').addEventListener('click',start);document.querySelector('#use').addEventListener('click',()=>show(document.querySelector('#manual').value.trim()||'пусто'));})();</script></body></html>
