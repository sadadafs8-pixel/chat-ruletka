<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ride Hub QR Test</title><style>body{margin:0;background:#090a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:600px;margin:auto;padding:20px 16px 40px}h1{font-size:30px;margin:12px 0}.muted{color:#9aa1ac;line-height:1.45}.box{position:relative;overflow:hidden;border-radius:22px;background:#11151a;aspect-ratio:3/4;border:1px solid #303741}video,#preview{width:100%;height:100%;object-fit:cover}#preview{display:none}.frame{position:absolute;left:14%;right:14%;top:27%;aspect-ratio:1;border:3px solid #b9ff38;border-radius:20px;box-shadow:0 0 0 999px #0004;pointer-events:none}.hint{position:absolute;left:14px;right:14px;bottom:14px;background:#0b0d11df;border:1px solid #333a45;border-radius:14px;padding:10px;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn,.upload{min-height:54px;border:0;border-radius:16px;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;text-align:center}.btn{background:#b9ff38;color:#10130d}.upload{background:#222731;color:#fff;border:1px solid #353b46;cursor:pointer}.upload input{display:none}.card{margin-top:12px;padding:14px;border-radius:18px;border:1px solid #303741;background:#15181d}.out{margin-top:9px;padding:12px;border-radius:14px;background:#0b0d10;border:1px solid #292f38;min-height:64px;white-space:pre-wrap;word-break:break-all;font:12px/1.45 ui-monospace,Menlo,monospace}.code{display:flex;gap:8px;margin-top:10px}.code input{min-width:0;flex:1;min-height:50px;border-radius:14px;border:1px solid #333944;background:#0d0f13;color:#fff;padding:0 13px;font-size:16px}.code button{border:1px solid #353b46;background:#222731;color:#fff;border-radius:14px;padding:0 16px;font-weight:900}.photoStatus{margin-top:8px;color:#9aa1ac;font-size:12px;line-height:1.4}@media(max-width:390px){.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="muted">Ride Hub · QR TEST</div><h1>Сканируй QR камерой или фото</h1><p class="muted">Можно навести камеру на наклейку либо выбрать готовую фотографию из галереи. Ниже появится точное содержимое QR.</p><div class="box"><video id="v" playsinline muted></video><img id="preview" alt="Загруженное фото"><div class="frame"></div><div id="hint" class="hint">Камера выключена</div></div><div class="actions"><button id="start" class="btn" type="button">Включить камеру</button><label class="upload">Загрузить фото<input id="file" type="file" accept="image/*"></label></div><div id="photoStatus" class="photoStatus">Поддерживаются обычные фото и скриншоты с QR.</div><section class="card"><b>Результат</b><div id="out" class="out">QR ещё не считан.</div><div class="code"><input id="manual" value="HC057A"><button id="use" type="button">Код</button></div></section></main><canvas id="c" hidden></canvas><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>(()=>{const v=document.querySelector('#v'),preview=document.querySelector('#preview'),file=document.querySelector('#file'),c=document.querySelector('#c'),x=c.getContext('2d',{willReadFrequently:true}),out=document.querySelector('#out'),hint=document.querySelector('#hint'),photoStatus=document.querySelector('#photoStatus');let run=false,s=null;function stopCamera(){run=false;if(s){s.getTracks().forEach(t=>t.stop());s=null}v.srcObject=null}function show(t,source='QR'){out.textContent=t;hint.textContent='Считано ✓';photoStatus.textContent=source+' распознан.';stopCamera()}async function start(){try{preview.style.display='none';v.style.display='block';stopCamera();s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=s;await v.play();run=true;hint.textContent='Держи QR внутри рамки';photoStatus.textContent='Камера активна.';requestAnimationFrame(scan)}catch(e){hint.textContent='Камера недоступна';photoStatus.textContent='Ошибка камеры: '+(e.message||e)}}function decodeCanvas(source){const im=x.getImageData(0,0,c.width,c.height);const q=window.jsQR&&jsQR(im.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(q&&q.data){show(q.data,source);return true}return false}function scan(){if(!run)return;if(v.readyState>=2&&v.videoWidth&&v.videoHeight){const max=1600,scale=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));c.width=Math.max(1,Math.round(v.videoWidth*scale));c.height=Math.max(1,Math.round(v.videoHeight*scale));x.drawImage(v,0,0,c.width,c.height);if(decodeCanvas('QR с камеры'))return}requestAnimationFrame(scan)}function scanImage(img){const max=2200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));x.drawImage(img,0,0,c.width,c.height);if(decodeCanvas('QR с фотографии'))return;photoStatus.textContent='QR на фото не найден. Попробуй фото ближе, ровнее и при хорошем свете.';out.textContent='QR не распознан на выбранном фото.';hint.textContent='QR не найден'}file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;if(!f.type.startsWith('image/')){photoStatus.textContent='Выбери файл изображения.';return}stopCamera();v.style.display='none';preview.style.display='block';photoStatus.textContent='Обрабатываю фото…';const url=URL.createObjectURL(f);preview.onload=()=>{try{scanImage(preview)}finally{URL.revokeObjectURL(url)}};preview.onerror=()=>{URL.revokeObjectURL(url);photoStatus.textContent='Не удалось открыть фото.'};preview.src=url});document.querySelector('#start').addEventListener('click',start);document.querySelector('#use').addEventListener('click',()=>show(document.querySelector('#manual').value.trim()||'пусто','Ручной код'));})();</script></body></html>
